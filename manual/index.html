        <li>원작 프로젝트: <a href="https://github.com/jamiepine/voicebox">github.com/jamiepine/voicebox</a></li>
      </ul>
    `,
  },
];

// ─────────────────────────────────────────────────────────────
// 렌더링 로직 (보통은 건드릴 필요가 없습니다)
// ─────────────────────────────────────────────────────────────
const nav = document.getElementById("nav");
const content = document.getElementById("content");
const groups = {};
for (const s of SECTIONS) { (groups[s.group] ||= []).push(s); }

for (const [group, items] of Object.entries(groups)) {
  const lbl = document.createElement("div");
  lbl.className = "group-label"; lbl.textContent = group;
  nav.appendChild(lbl);
  for (const item of items) {
    const a = document.createElement("a");
    a.textContent = item.label;
    a.href = "#" + item.id;
    a.dataset.id = item.id;
    a.addEventListener("click", (e) => { e.preventDefault(); show(item.id); });
    nav.appendChild(a);
  }
}

function show(id) {
  content.innerHTML = "";
  for (const s of SECTIONS) {
    const div = document.createElement("section");
    div.className = "section" + (s.id === id ? " active" : "");
    div.id = "sec-" + s.id;
    div.innerHTML = s.html;
    content.appendChild(div);
  }
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === id));
  window.scrollTo({ top: 0 });
}

// 검색
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll("nav a").forEach((a) => {
    const s = SECTIONS.find((x) => x.id === a.dataset.id);
    const hay = (s.label + " " + s.html).toLowerCase();
    a.style.display = hay.includes(q) ? "" : "none";
  });
});

// 테마
const themeToggle = document.getElementById("themeToggle");
const saved = localStorage.getItem("vb-manual-theme") || "dark";
document.documentElement.setAttribute("data-theme", saved);
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("vb-manual-theme", next);
});

// Ctrl+K → 검색 포커스
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); search.focus(); }
});

// 초기 로드 — 해시 기반 섹션
show(window.location.hash.slice(1) || SECTIONS[0].id);
</script>
</body>
</html>
